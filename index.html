<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2340">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="description" content="Des histoires personnalisées de 5 à 7 minutes dont votre enfant est le héros, à lire ou à écouter.">
<title>À toi l'histoire</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;800&display=swap">
<style>
html{-webkit-text-size-adjust:100%}body{margin:0}[hidden]{display:none!important}img{max-width:100%}
/* Layout : une question par écran, gros boutons illustrés ; le monde choisi teinte toute l'appli. */
:root{
  --bg:#EEF3FB; --surface:#FFFFFF; --ink:#1B2340; --muted:#5A6485; --line:#D5DDEE; --on-accent:#FFFFFF;
  --roblox:#D0352A; --roblox-soft:#FCE3DF;
  --minecraft:#2A7F39; --minecraft-soft:#DDF2DF;
  --enquetes:#A85F08; --enquetes-soft:#FBEBD0;
  --gabby:#B9328F; --gabby-soft:#FBDFF1;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --r:22px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12172B; --surface:#1C2340; --ink:#EEF1FA; --muted:#A3ADCB; --line:#343D63; --on-accent:#12172B;
    --roblox:#FF8274; --roblox-soft:#47231F;
    --minecraft:#72D47F; --minecraft-soft:#1D3A24;
    --enquetes:#F2B04C; --enquetes-soft:#40300F;
    --gabby:#F58AD3; --gabby-soft:#452142;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12172B; --surface:#1C2340; --ink:#EEF1FA; --muted:#A3ADCB; --line:#343D63; --on-accent:#12172B;
  --roblox:#FF8274; --roblox-soft:#47231F;
  --minecraft:#72D47F; --minecraft-soft:#1D3A24;
  --enquetes:#F2B04C; --enquetes-soft:#40300F;
  --gabby:#F58AD3; --gabby-soft:#452142;
  color-scheme:dark;
}
.u-roblox{--accent:var(--roblox);--accent-soft:var(--roblox-soft)}
.u-minecraft{--accent:var(--minecraft);--accent-soft:var(--minecraft-soft)}
.u-enquetes{--accent:var(--enquetes);--accent-soft:var(--enquetes-soft)}
.u-gabby{--accent:var(--gabby);--accent-soft:var(--gabby-soft)}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
.page{max-width:1040px;margin:0 auto;padding-block:16px 32px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;flex-direction:column;gap:20px}

.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1;margin:0;margin-right:auto}
.brand span{color:var(--accent)}
.homeb{border:3px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 18px;font-family:var(--display);font-weight:800;font-size:1.05rem;min-height:52px}
.home{display:flex;flex-direction:column;gap:24px;padding-top:12px}
.hero{font-family:var(--display);font-weight:800;font-size:clamp(2.8rem,9vw,4.6rem);line-height:1;margin:0;letter-spacing:-.01em}
.hero span{color:var(--accent)}
.lead{margin:0;font-size:clamp(1.15rem,2.6vw,1.4rem);line-height:1.5;max-width:56ch;font-weight:600}
.cta{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.cta .go{margin:0;font-size:1.6rem;padding:16px 34px;min-height:72px}
.how{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.how li{background:var(--surface);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.how b{font-family:var(--display);font-size:1.25rem;line-height:1.2}
.how .num{font-family:var(--display);font-weight:800;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font-size:1.1rem;line-height:1}
.worlds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.worlds figure{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.worlds canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;border-radius:14px}
.worlds figcaption{font-weight:800;font-size:.92rem;line-height:1.2}
.steps{display:flex;gap:8px;align-items:center}
.steps i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.steps i.done{background:var(--accent)}
.steps i.on{background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}

.q{display:flex;align-items:center;gap:12px}
.q h2{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,4.5vw,2.5rem);line-height:1.1;margin:0;text-wrap:balance}
.q .count{margin-left:auto;font-family:var(--display);font-weight:800;font-size:1.4rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.say{flex:none;width:52px;height:52px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:1.4rem;line-height:1}
.note{margin:0;background:var(--accent-soft);border-radius:16px;padding:12px 16px;font-weight:800;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.note button{margin-left:auto}

.grid{display:grid;gap:16px}
.grid.big{grid-template-columns:repeat(2,minmax(0,1fr));max-width:max(320px, calc((100vh - 390px) * 1.78))}
.grid.med{grid-template-columns:repeat(auto-fill,minmax(128px,1fr))}
.card{position:relative;border:4px solid var(--line);background:var(--surface);border-radius:var(--r);padding:0;overflow:hidden;
  display:flex;flex-direction:column;text-align:left;min-width:0;transition:transform .15s}
.card canvas{display:block;width:100%;height:auto;aspect-ratio:16/9}
.card b{font-family:var(--display);font-weight:800;font-size:1.3rem;line-height:1.15;padding:10px 14px 12px}
.card[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 6px 0 var(--accent)}
.card:active,.tile:active{transform:scale(.97)}
.tile{border:4px dashed var(--line);background:transparent;border-radius:var(--r);padding:10px 6px;min-height:116px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;font-weight:800;font-size:1rem;line-height:1.2;transition:transform .15s}
.tile .em{font-size:2.7rem;line-height:1.1}
.tile[aria-pressed="true"]{border:4px solid var(--accent);background:var(--surface);box-shadow:0 6px 0 var(--accent)}
.tile.full{opacity:.4}
.sub{font-family:var(--display);font-weight:800;font-size:1.3rem;margin:8px 0 0}

.nav{display:flex;align-items:center;gap:12px}
.go{border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);font-family:var(--display);font-weight:800;font-size:1.4rem;padding:14px 30px;margin-left:auto;min-height:64px}
.go:disabled{opacity:.35;cursor:default}
.back{border:3px solid var(--line);background:var(--surface);border-radius:999px;font-family:var(--display);font-weight:800;font-size:1.2rem;padding:12px 22px;min-height:64px}

/* Livre */
.bookv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.left{display:flex;flex-direction:column;gap:14px;min-width:0;position:sticky;top:calc(env(safe-area-inset-top, 0px) + 12px)}
.illus{display:block;width:100%;height:auto;aspect-ratio:16/9;border-radius:var(--r);border:4px solid var(--accent)}
.bookv h3{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1.15;margin:0;text-wrap:balance}
.chapter{font-size:.82rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--accent)}
.ctrl{display:flex;align-items:center;gap:12px}
.ctrl .go{margin:0;flex:1}
.round{flex:none;width:64px;height:64px;border-radius:50%;border:3px solid var(--line);background:var(--surface);font-size:1.5rem;font-weight:800;line-height:1}
.round:disabled{opacity:.35;cursor:default}
.dots{display:flex;gap:8px;justify-content:center}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.meta{margin:0;color:var(--muted);font-size:.9rem;font-weight:600}
.text{display:flex;flex-direction:column;gap:.7em;background:var(--surface);border-radius:var(--r);padding:22px;min-width:0}
.text p{margin:0;max-width:62ch;border-radius:8px}
.text.a0{font-size:1.35rem;line-height:1.55;font-weight:600}
.text.a1{font-size:1.2rem;line-height:1.6}
.text.a2{font-size:1.08rem;line-height:1.65}
.text p.now{background:var(--accent-soft);box-shadow:0 0 0 6px var(--accent-soft)}
.text p:first-child::first-letter{font-family:var(--display);font-weight:800;font-size:2.2em;color:var(--accent);line-height:.9;padding-right:2px}

.field{background:var(--surface);border:4px solid var(--line);border-radius:var(--r);padding:16px 20px;font-family:var(--display);font-weight:800;font-size:1.7rem;width:100%;max-width:440px;min-width:0}
footer{color:var(--muted);font-size:.8rem;border-top:2px solid var(--line);padding-top:12px}
footer p{margin:0;max-width:85ch}

@media (max-width:820px){
  .bookv{grid-template-columns:minmax(0,1fr)}
  .left{position:static}
}
@media (max-width:480px){
  .page{gap:12px;padding-block:10px 16px}
  #view{gap:12px!important}
  .grid{gap:10px}
  .grid.med{grid-template-columns:repeat(3,minmax(0,1fr))}
  .card{border-width:3px;border-radius:16px}
  .card b{font-size:1rem;padding:6px 10px 8px}
  .tile{min-height:88px;padding:8px 4px;border-width:3px;border-radius:16px;font-size:.78rem;gap:2px}
  .tile .em{font-size:2rem}
  .tile[aria-pressed="true"]{border-width:3px;box-shadow:0 4px 0 var(--accent)}
  .q{gap:8px}.q h2{font-size:1.45rem}.q .count{font-size:1.1rem}
  .say{width:42px;height:42px;font-size:1.1rem}
  .sub{font-size:1.1rem;margin:0}
  .field{font-size:1.3rem;padding:10px 16px;border-width:3px}
  .go,.back{min-height:52px;font-size:1.15rem;padding:10px 20px}
  .homeb{min-height:44px;padding:6px 14px;font-size:.95rem}
  .brand{font-size:1.35rem}
    .steps{display:none}
  .how{grid-template-columns:minmax(0,1fr)}
  .worlds{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cta .go{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

</div>

  const Rc=(x,y,w,h,f)=>{c.fillStyle=f;c.fillRect(x,y,w,h);};
  const Ci=(x,y,q,f)=>{c.fillStyle=f;c.beginPath();c.arc(x,y,q,0,7);c.fill();};
  const El=(x,y,rx,ry,f)=>{c.fillStyle=f;c.beginPath();c.ellipse(x,y,rx,ry,0,0,7);c.fill();};
  const RR=(x,y,w,h,q,f)=>{c.fillStyle=f;c.beginPath(); if(c.roundRect) c.roundRect(x,y,w,h,q); else c.rect(x,y,w,h); c.fill();};
  const Tri=(a,b,d,e,f,g,col)=>{c.fillStyle=col;c.beginPath();c.moveTo(a,b);c.lineTo(d,e);c.lineTo(f,g);c.fill();};
  const SKY={soleil:"#8FD3FF",neige:"#D5E1EE",pluie:"#8C9DB8",vent:"#F6D29A"};
  Rc(0,0,W,H,eve?"#2B3266":SKY[met]);
  if(eve) for(let i=0;i<30;i++) Ci(r()*W,r()*H*.5,1.5+r()*1.5,"#FFFFFF");
  const astre=eve?"#F4F1D0":"#FFE066";
  if(eve||met==="soleil"||met==="vent"){ if(k==="minecraft") Rc(W*.82,H*.08,H*.15,H*.15,astre); else Ci(W*.86,H*.17,H*.09,astre); }
  const grass=snow?"#F2F6FA":null;

  if(k==="minecraft"){
    const b=W/20, gy=H-3*b;
    [[W*.1,H*.12,3],[W*.42,H*.2,4]].forEach(([x,y,n])=>Rc(x,y,n*b,b,eve?"#59608F":"#FFFFFF"));
    if(adv===0){
      for(let i=0;i<6;i++) Rc(W*.36+i*b,gy-(i+1)*b,(12-2*i)*b,b,i>=4||snow?"#F2F6FA":(i%2?"#7B8089":"#8A8F98"));
      Rc(W*.36+5*b,gy-2*b,2*b,2*b,"#1E2230");
      if(ch>=3){ Rc(W*.36+5.5*b,gy-b,b,b,"#8A5A2B"); Rc(W*.36+5.7*b,gy-.8*b,.25*b,.25*b,"#3FD67C"); Rc(W*.36+6.1*b,gy-.5*b,.25*b,.25*b,"#3FD67C"); }
      Rc(2*b,gy-2*b,b,2*b,"#7A5230"); Rc(b,gy-4*b,3*b,2*b,snow?"#DCE8E0":"#2F8F3E");
      for(let i=0;i<20;i++){ Rc(i*b,gy,b,b,grass||(i%2?"#58B04A":"#63BD55")); Rc(i*b,gy+b,b,2*b,i%2?"#8A5A2B":"#7D5126"); }
    } else {
      for(let j=0;j<4;j++) for(let i=0;i<20;i++) Rc(i*b,H-4*b+j*b,b,b,(i+j)%2?"#3F7FD9":"#4A8BE6");
      Rc(W*.5,H-5*b,8*b,b,snow?"#F2F6FA":"#E9D8A0"); Rc(W*.52,H-4*b,7*b,b,"#D9C68C");
      for(let i=0;i<6;i++) Rc(W*.72,H-6*b-i*b,1.5*b,b,i%2?"#D64538":"#F7F7F7");
      const lit=ch>=3; Rc(W*.7,H-12.8*b,2.1*b,.9*b,lit?"#FFE066":"#6C7280");
      if(lit){ c.globalAlpha=.35; Tri(W*.7,H-12.4*b,0,H-16*b,0,H-8*b,"#FFE066"); c.globalAlpha=1; }
      Rc(W*.56,H-7*b,.5*b,2*b,"#7A5230"); Rc(W*.53,H-8*b,2*b,b,"#2F8F3E");
      const bx=[W*.08,W*.25,W*.4,W*.4,W*.12][ch]; Rc(bx,H-4.6*b,2.5*b,.8*b,"#7A5230"); Rc(bx+b,H-6.2*b,.25*b,1.6*b,"#7A5230"); Rc(bx+1.25*b,H-6.2*b,b,b,"#F7F7F7");
    }
  }
  if(k==="roblox"){
    [[W*.15,H*.2],[W*.55,H*.12]].forEach(([x,y])=>RR(x,y,W*.16,H*.08,H*.04,eve?"#59608F":"#FFFFFF"));
    Rc(0,H*.8,W,H*.2,grass||"#4CB45A"); for(let i=0;i<16;i++) El(W*(i+.5)/16,H*.83,W*.016,H*.012,snow?"#DCE4EC":"#3E9E4C");
    const cols=["#2E86DE","#F5B700","#E0483C","#8E5BD9","#19B37A","#F58220"];
    if(adv===0){
      for(let i=0;i<6;i++){ const x=W*(.1+i*.135), y=H*(.7-i*.105); Rc(x,y,W*.11,H*.055,cols[i]); for(let s=0;s<3;s++) Rc(x+W*(.012+s*.035),y-H*.014,W*.02,H*.014,cols[i]); }
      const tx=W*.83,ty=H*.1; Rc(tx,ty,W*.06,H*.07,"#F5C518"); Rc(tx+W*.022,ty+H*.07,W*.016,H*.035,"#F5C518"); Rc(tx+W*.008,ty+H*.1,W*.044,H*.02,"#C99A0A");
    } else {
      const cx=W*.64, cy=H*.42, q=H*.3, rot=ch*.35, on=ch!==2;
      c.strokeStyle="#6C7280"; c.lineWidth=H*.016; c.beginPath(); c.moveTo(cx,cy); c.lineTo(cx-W*.09,H*.8); c.moveTo(cx,cy); c.lineTo(cx+W*.09,H*.8); c.stroke();
      c.strokeStyle=on?"#5B6CD9":"#9AA0AE"; c.lineWidth=H*.02; c.beginPath(); c.arc(cx,cy,q,0,7); c.stroke();
      c.lineWidth=H*.008; for(let i=0;i<8;i++){ const a=rot+i*Math.PI/4; c.beginPath(); c.moveTo(cx,cy); c.lineTo(cx+Math.cos(a)*q,cy+Math.sin(a)*q); c.stroke(); }
      for(let i=0;i<8;i++){ const a=rot+i*Math.PI/4; RR(cx+Math.cos(a)*q-W*.022,cy+Math.sin(a)*q-H*.01,W*.044,H*.06,6,i===0?"#E0483C":cols[(i%5)+0===2?3:(i%5)]); }
      Tri(W*.1,H*.8,W*.3,H*.8,W*.3,H*.52,"#2E86DE"); Rc(W*.3,H*.52,W*.035,H*.28,"#F5B700"); Rc(W*.29,H*.48,W*.055,H*.04,"#E0483C");
    }
  }
  if(k==="enquetes"){
    El(W*.22,H*1.02,W*.5,H*.3,grass||"#7DBB6A"); El(W*.8,H*1.05,W*.55,H*.36,snow?"#E6EDF3":"#69A85B");
    const tree=(x,y,s,hole)=>{ Rc(x-s*.12,y-s,s*.24,s,"#7A5230"); const g=snow?"#DCE8E0":(met==="vent"?"#D98A2B":"#3F8A4A");
      Ci(x,y-s*1.25,s*.5,g); Ci(x-s*.38,y-s*.95,s*.36,g); Ci(x+s*.38,y-s*.95,s*.36,g); if(hole) El(x,y-s*.55,s*.08,s*.11,"#2A1A0E"); };
    tree(W*.12,H*.8,H*.26); tree(W*.92,H*.76,H*.22);
    if(adv===0){ tree(W*.68,H*.8,H*.5,true);
      for(let i=0;i<6;i++) El(W*(.3+i*.055),H*(.9-(i%2)*.02),W*.008,H*.012,"#5A4630");
      if(ch>=3) c.font=`${H*.12}px serif`, c.fillText("🦝",W*.62,H*.6);
    } else {
      const full=ch>=4; El(W*.6,H*.82,W*(full?.3:.18),H*(full?.1:.06),"#5FB0D8");
      if(!full) { c.strokeStyle="#B89B6A"; c.lineWidth=H*.012; c.beginPath(); c.ellipse(W*.6,H*.82,W*.3,H*.1,0,0,7); c.stroke(); }
      [[.52,.81],[.64,.84],[.7,.8]].forEach(([x,y],i)=>{ El(W*x,H*y,W*.025,H*.016,"#3F8A4A"); if(full) Ci(W*x,H*y-H*.01,H*.012,"#F58AD3"); });
      c.strokeStyle="#4E7A3A"; c.lineWidth=H*.008; for(let i=0;i<7;i++){ const x=W*(.84+i*.012); c.beginPath(); c.moveTo(x,H*.86); c.lineTo(x+W*.004,H*(.66+(i%3)*.03)); c.stroke(); El(x+W*.004,H*(.66+(i%3)*.03),W*.004,H*.022,"#7A5230"); }
      if(full||ch===1) c.font=`${H*.1}px serif`, c.fillText("🐸",W*.56,H*.84);
    }
  }
  if(k==="gabby"){
    Rc(0,H*.78,W,H*.22,snow?"#F7EAF2":"#F7C9DE");
    const x=W*.3,y=H*.24,w=W*.42,hh=H*.58;
    Tri(x+w*.08,y+H*.02,x+w*.2,y-H*.14,x+w*.36,y+H*.02,"#F59AC6"); Tri(x+w*.64,y+H*.02,x+w*.8,y-H*.14,x+w*.92,y+H*.02,"#F59AC6");
    RR(x,y,w,hh,H*.05,"#F59AC6");
    const rooms=["#FFF1B8","#BDE7FF","#D9C8FF","#C9F2D0","#FFD3B8","#FFE1F0"];
    for(let i=0;i<6;i++){ const rx=x+w*(.07+(i%2)*.46), ry=y+hh*(.07+Math.floor(i/2)*.31); RR(rx,ry,w*.4,hh*.25,H*.025,rooms[i]); }
    if(adv===0){ const nc=["#E0483C","#F58220","#F5B700","#19B37A","#2E86DE","#8E5BD9","#F58AD3"];
      c.font=`800 ${H*.11}px serif`; const found=[0,1,6,7,7][ch];
      for(let i=0;i<7;i++){ c.fillStyle=nc[i]; if(i<found) c.fillText("♪",x+w+W*(.03+(i%4)*.045),H*(.3+Math.floor(i/4)*.14)); else c.fillText("♪",W*(.05+r()*.2),H*(.12+r()*.5)); }
    } else { const s=[.25,.4,1,1,1][ch], cx=W*.86, by=H*.82, cw=W*.2*s;
      RR(cx-cw/2,by-H*.2*s,cw,H*.2*s,H*.02,"#F7D08A"); RR(cx-cw*.38,by-H*.36*s,cw*.76,H*.17*s,H*.02,"#F7D08A");
      if(ch>=3){ RR(cx-cw/2,by-H*.22*s,cw,H*.06*s,H*.02,"#F58AD3"); RR(cx-cw*.38,by-H*.38*s,cw*.76,H*.06*s,H*.02,"#F58AD3"); for(let i=0;i<3;i++) Ci(cx+(i-1)*cw*.22,by-H*.4*s,H*.02,"#E0483C"); }
    }
  }
  // météo
  if(snow) for(let i=0;i<70;i++) Ci(r()*W,r()*H,2+r()*3,"#FFFFFF");
  if(met==="pluie"){ c.strokeStyle="#D7E3F5"; c.lineWidth=2; for(let i=0;i<80;i++){ const x=r()*W,y=r()*H; c.beginPath(); c.moveTo(x,y); c.lineTo(x-6,y+18); c.stroke(); } }
  if(met==="vent") for(let i=0;i<16;i++){ c.save(); c.translate(r()*W,r()*H*.8); c.rotate(r()*3); El(0,0,9,4,i%2?"#D9662B":"#E8A12B"); c.restore(); }
  // héros, amis, objets
  if(cast){ c.textBaseline="bottom"; const x0=W*(.04+ch*.03); c.font=`${H*.2}px serif`; c.fillStyle="#000";
    ["🧒",...cast.chars].forEach((e,i)=>c.fillText(e,x0+i*H*.2,H*.99));
    c.font=`${H*.11}px serif`; cast.objs.forEach((e,i)=>c.fillText(e,x0+(cast.chars.length+1)*H*.2+i*H*.12,H*.98));
    c.textBaseline="alphabetic"; }
}
const canvas = (w,hh,cls) => h("canvas",{width:w,height:hh,class:cls||"",role:"img"});

/* ---- Voix ---- */
const synth = window.speechSynthesis || null;
const MALE = /thomas|paul|henri|claude|daniel|nicolas|jacques|antoine|mathieu|guillaume|male\b|homme|masculin/i;
const FEMALE = /am[ée]lie|marie|audrey|julie|hortense|denise|[ée]lo[iï]se|c[ée]line|aur[ée]lie|virginie|sylvie|l[ée]a|female|femme|f[ée]minin/i;
function frVoices(){ try{ return synth ? synth.getVoices().filter(v=>/^fr/i.test(v.lang)) : []; }catch(e){ return []; } }
// Les voix « naturelles » ou en ligne sonnent moins robotiques : on les préfère quand l'appareil en propose.
const GOOD = /natural|neural|premium|enhanced|am[ée]lior|online|wavenet|google/i;
const quality = v => (GOOD.test(v.name)?4:0) + (v.localService===false?2:0) + (/^fr[-_]FR/i.test(v.lang)?1:0);
function pickVoice(p){ const all=frVoices().sort((x,y)=>quality(y)-quality(x)); if(!all.length) return null;
  const m=all.filter(v=>MALE.test(v.name)&&!FEMALE.test(v.name)), f=all.filter(v=>FEMALE.test(v.name));
  const pool=p.g==="m"?m:f; if(pool.length) return pool[p.alt%pool.length];
  const best=all.filter(v=>quality(v)===quality(all[0])); return best[p.alt%best.length]; }
function utter(text,p,amb){ const ut=new SpeechSynthesisUtterance(text.replace(/[«»]/g," ")); const v=pickVoice(p); if(v) ut.voice=v;
  ut.lang=v?v.lang:"fr-FR"; ut.pitch=Math.max(.1,p.pitch+(amb?amb.pitch:0)); ut.rate=p.rate*AGES[S.age].rate*(amb?amb.rate:1); return ut; }
function sayOnce(text){ if(!synth) return; stopReading(); synth.speak(utter(text, VOICES.find(v=>v.k===S.voice)||VOICES[1])); }
function stopReading(){ R.on=false; R.idx=0; R.tok++; if(synth) synth.cancel(); }
function speak(){
  const ps=[...document.querySelectorAll("#text p")];
  if(R.idx>=ps.length){ if(S.page<CHAPTERS.length-1){ S.page++; R.idx=0; render(); return speak(); } stopReading(); render(); return; }
  ps.forEach((p,i)=>p.classList.toggle("now",i===R.idx));
  ps[R.idx].scrollIntoView({block:"nearest",behavior:"smooth"});
  const ut=utter(ps[R.idx].textContent, VOICES.find(v=>v.k===S.voice)||VOICES[1], AMB[S.amb]), tok=++R.tok;
  ut.onend=()=>{ if(tok!==R.tok||!R.on) return; R.idx++; setTimeout(()=>{ if(tok===R.tok&&R.on) speak(); },280); };
  ut.onerror=e=>{ if(tok!==R.tok||e.error==="interrupted"||e.error==="canceled") return; R.on=false; R.msg="La lecture vocale est bloquée dans ce navigateur."; render(); };
  synth.speak(ut);
}
/* ---- Écrans ---- */
const AGE_ICON = ["🐣","🦊","🚀"];
const STEPS = ["Comment t'appelles-tu ?","Choisis ton monde","Où vas-tu ?","Qui vient avec toi ?","Que mets-tu dans ton sac ?","Quel temps fait-il ?","Qui raconte ?"];
function go(step){ stopReading(); S.step=step; S.view="wiz"; save(); render(); window.scrollTo(0,0); }
function goHome(){ stopReading(); S.view="home"; render(); window.scrollTo(0,0); }
function openBook(){ stopReading(); S.view="book"; S.made=true; S.page=0; R.msg=""; save(); render(); window.scrollTo(0,0); }

function tilesFor(items, sel){
  return h("div",{class:"grid med"}, items.map((it,i)=>{ const on=sel.includes(i);
    return h("button",{class:"tile"+(!on&&sel.length>=MAX?" full":""),type:"button","aria-pressed":on,
      onclick:()=>{ const k=sel.indexOf(i); if(k>=0) sel.splice(k,1); else if(sel.length<MAX) sel.push(i); else return; save(); render(); }},
      h("span",{class:"em"},it.e), h("span",null,it.n)); }));
}
function pickTiles(map, cur, set){
  return h("div",{class:"grid med"}, Object.entries(map).map(([k,v])=>h("button",{class:"tile",type:"button","aria-pressed":k===cur,onclick:()=>{ set(k); save(); render(); }}, h("span",{class:"em"},v.e), h("span",null,v.n))));
}
function head(title, count){ return h("div",{class:"q"}, h("button",{class:"say",type:"button","aria-label":"Écouter la question",onclick:()=>sayOnce(title)},"🔊"), h("h2",null,title), count?h("span",{class:"count"},count):null); }

function viewHome(){
  const HOW=[["Tu choisis","Un monde, un lieu, jusqu'à trois amis et trois objets à emporter."],
             ["Tu règles l'ambiance","Le temps qu'il fait, et une histoire rigolote, toute douce ou pleine de mystère."],
             ["Tu écoutes","Cinq chapitres illustrés, racontés par la voix de ton choix."]];
  return h("div",{class:"home"},
    h("h2",{class:"hero"},"À toi ",h("span",null,"l'histoire")),
    h("p",{class:"lead"},"Ici, c'est toi le héros. Choisis ton monde, tes amis et tes objets : ton histoire s'écrit avec ton prénom, puis elle se lit ou s'écoute en 5 à 7 minutes."),
    h("div",{class:"cta"},
      h("button",{class:"go",type:"button",onclick:()=>go(0)},"✨ Créer mon histoire"),
      S.made?h("button",{class:"back",type:"button",onclick:()=>{ stopReading(); S.view="book"; R.msg=""; render(); window.scrollTo(0,0); }},"📖 Relire ma dernière histoire"):null),
    h("ol",{class:"how"}, HOW.map(([t,d],i)=>h("li",null,h("span",{class:"num"},String(i+1)),h("b",null,t),h("span",null,d)))),
    h("p",{class:"sub"},"4 mondes, 8 aventures"),
    h("div",{class:"worlds"}, Object.entries(U).map(([k,t])=>{ const cv=canvas(320,180); scene(cv,k,0,"soleil",0,null); return h("figure",null,cv,h("figcaption",null,t.n)); })));
}

function viewWiz(){
  const u=U[S.u], out=[], st=S.step; let ready=true;
  out.push(head(STEPS[st], st===3?S.chars.length+" / "+MAX : st===4?S.objs.length+" / "+MAX : null));
  if(st===0){
    out.push(h("input",{class:"field big",id:"prenom",type:"text",maxlength:"20",value:S.name,autocomplete:"off",enterkeyhint:"done","aria-label":"Ton prénom",oninput:e=>{ S.name=e.target.value; save(); }}));
    out.push(h("p",{class:"sub"},"Quel âge as-tu ?"));
    out.push(h("div",{class:"grid med"}, AGES.map((g,i)=>h("button",{class:"tile",type:"button","aria-pressed":i===S.age,onclick:()=>{ S.age=i; save(); render(); }}, h("span",{class:"em"},AGE_ICON[i]), h("span",null,g.l)))));
  }
  if(st===1) out.push(h("div",{class:"grid big"}, Object.entries(U).map(([k,t])=>{ const cv=canvas(480,270); scene(cv,k,0,S.meteo,0,null);
    return h("button",{class:"card u-"+k,type:"button","aria-pressed":k===S.u,
      onclick:()=>{ if(S.u!==k){ S.u=k; S.adv=0; S.chars=[0,1]; S.objs=[0,1]; } go(2); }}, cv, h("b",null,t.n)); })));
  if(st===2) out.push(h("div",{class:"grid big"}, u.adv.map((a,i)=>{ const cv=canvas(480,270); scene(cv,S.u,i,S.meteo,i===0?0:2,null);
    return h("button",{class:"card",type:"button","aria-pressed":i===S.adv,onclick:()=>{ S.adv=i; go(3); }}, cv, h("b",null,a.lieu.e+" "+a.lieu.n)); })));
  if(st===3){ out.push(tilesFor(u.chars,S.chars)); ready=S.chars.length>0; }
  if(st===4){ out.push(tilesFor(u.objs,S.objs)); ready=S.objs.length>0; }
  if(st===5){ out.push(pickTiles(METEO,S.meteo,k=>S.meteo=k)); out.push(h("p",{class:"sub"},"Quelle histoire veux-tu ?")); out.push(pickTiles(AMB,S.amb,k=>S.amb=k)); }
  if(st===6){
    const ICON={papa:"👨",maman:"👩",mamie:"👵",papi:"👴",enfant:"🧒"};
    out.push(h("div",{class:"grid med"}, VOICES.map(v=>h("button",{class:"tile",type:"button","aria-pressed":S.voice===v.k,onclick:()=>{ S.voice=v.k; save(); render(); sayOnce("Bonjour "+name()+" ! C'est moi qui raconte."); }}, h("span",{class:"em"},ICON[v.k]), h("span",null,v.l)))));
  }
  const last=st===STEPS.length-1;
  out.push(h("div",{class:"nav"},
    st>0?h("button",{class:"back",type:"button",onclick:()=>go(st-1)},"← Retour"):null,
    st===0||st>=3?h("button",{class:"go",type:"button",disabled:!ready,onclick:()=>last?openBook():go(st+1)}, last?"▶ Mon histoire !":"Suite →"):null));
  return out;
}

function viewBook(){
  const u=U[S.u], adv=u.adv[S.adv], chs=chapters(), cv=canvas(800,450,"illus");
  scene(cv,S.u,S.adv,S.meteo,S.page,{chars:S.chars.map(i=>u.chars[i].e),objs:S.objs.map(i=>u.objs[i].e)});
  cv.setAttribute("aria-label","Illustration du chapitre "+(S.page+1));
  const last=S.page===CHAPTERS.length-1, canPlay=!!synth;
  const who="la voix de "+(VOICES.find(v=>v.k===S.voice)||VOICES[1]).l.toLowerCase();
  return h("div",{class:"bookv"},
    h("div",{class:"left"}, cv,
      h("div",{class:"ctrl"},
        h("button",{class:"round",type:"button",disabled:S.page===0,"aria-label":"Chapitre précédent",onclick:()=>turn(S.page-1)},"←"),
        h("button",{class:"go",type:"button",disabled:!canPlay,onclick:togglePlay}, R.on?"❚❚ Pause":"▶ Écouter"),
        h("button",{class:"round",type:"button","aria-label":last?"Revenir au début":"Chapitre suivant",onclick:()=>turn(last?0:S.page+1)}, last?"↺":"→")),
      h("div",{class:"dots","aria-hidden":"true"}, CHAPTERS.map((_,i)=>h("i",{class:i===S.page?"on":""}))),
      h("p",{class:"meta"}, R.msg || (!canPlay?"La lecture vocale n'est pas disponible dans ce navigateur.":"Environ "+Math.round(wordCount()/(AGES[S.age].wpm*AMB[S.amb].rate))+" min, avec "+who+".")),
      h("button",{class:"back",type:"button",onclick:()=>go(1)},"✨ Nouvelle histoire")),
    h("div",{style:"display:flex;flex-direction:column;gap:10px;min-width:0"},
      h("h3",null,adv.titre(name())),
      h("span",{class:"chapter"},"Chapitre "+(S.page+1)+" sur "+CHAPTERS.length+" · "+CHAPTERS[S.page]),
      h("div",{class:"text a"+S.age,id:"text"}, chs[S.page].map((t,i)=>h("p",{class:R.on&&i===R.idx?"now":""},t)))));
}
function togglePlay(){ if(R.on){ R.on=false; R.tok++; if(synth) synth.cancel(); render(); } else { R.on=true; R.msg=""; render(); speak(); } }
function turn(p){ const was=R.on; stopReading(); S.page=p; R.on=was; save(); render(); if(was) speak(); }

function render(){
  $("app").className="page u-"+S.u;
  const st=$("steps"); st.textContent="";
  if(S.view==="wiz") STEPS.forEach((_,i)=>st.append(h("i",{class:i<S.step?"done":i===S.step?"on":""})));
  const v=$("view"); v.textContent="";
  $("bar").hidden = S.view==="home"; $("foot").hidden = S.view!=="home";
  v.append(...[].concat(S.view==="book"?viewBook():S.view==="home"?viewHome():viewWiz()));
}
if(synth && synth.addEventListener) synth.addEventListener("voiceschanged",()=>{});
window.addEventListener("pagehide",()=>{ if(synth) synth.cancel(); });
if(!VOICES.some(v=>v.k===S.voice)) S.voice="maman";
if(!(S.step>=0 && S.step<STEPS.length)) S.step=0;
S.view="home"; R.on=false;
$("home").onclick=goHome;
render();
</script>
<script>
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
